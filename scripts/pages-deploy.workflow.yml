# PARKED — not active yet.
#
# GitHub rejects any push that adds a file under .github/workflows/ unless the
# pushing token carries the `workflow` scope, and the local gh token does not.
# So this lives here until that is granted. To activate:
#
#   gh auth refresh -s workflow
#   mkdir -p .github/workflows
#   git mv scripts/pages-deploy.workflow.yml .github/workflows/deploy.yml
#   git commit -m "Activate Pages deploy workflow" && git push
#
# Then switch Pages source to GitHub Actions, delete the gh-pages branch, and
# remove scripts/deploy-pages.sh and the `deploy` npm script.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on the data-layer and render tests.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
